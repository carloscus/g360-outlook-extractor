[project]
name = "g360-outlook-extractor"
version = "1.0.0"
description = "Herramienta de extracción y auditoría de Outlook para el ecosistema G360"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.21.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv]
managed = true
package = true

[project.scripts]
g360-outlook-extractor = "g360_outlook_extractor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
